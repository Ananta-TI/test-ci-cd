image: node:22

stages:
  - lint
  - build

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint
    - |
      for f in $(find server api -name '*.js' -not -path '*/node_modules/*'); do
        node --check "$f"
      done

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week